name: Daily IT News Digest

on:
  schedule:
    - cron: '0 0 * * *'  # 0 UTC = 9 AM KST
  workflow_dispatch:  # allow manual trigger from the GitHub UI

# Never let a manual run and the scheduled run race each other on the state file / push.
concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # required to push the generated posts and state file
      actions: write   # required to dispatch pages-deploy.yml after pushing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Java (for KoNLPy)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Crawl sources over the runner's network (all except ETNews)
        # ZDNet, Digital Times, Digital Daily, DailySecu and BoanNews are crawled over the runner's normal network first.
        # Only ETNews is known to block GitHub's Azure IP ranges, so it waits for the WARP step below.
        # continue-on-error: any source that fails here is retried through WARP in the next pipeline step.
        id: direct
        continue-on-error: true
        run: python scripts/run_daily.py --exclude-source etnews

      - name: Set up Cloudflare WARP
        # GitHub-hosted runners share Azure's public IP ranges, which ETNews
        # blocks at the network level (connect timeout, not an HTTP error).
        # Cloudflare WARP is a free consumer VPN (WireGuard-based, no account
        # needed) that routes traffic through Cloudflare's network instead,
        # giving the crawl step a non-Azure exit IP. It's disconnected again
        # right after the crawl so later steps (git push, gh CLI) keep using
        # the runner's normal network path.
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

          sudo systemctl enable --now warp-svc
          for i in $(seq 1 15); do
            warp-cli --accept-tos status >/dev/null 2>&1 && break
            sleep 1
          done

          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect

          # "Success" from the commands above only means they were accepted, not
          # that the WireGuard tunnel actually came up - poll real status instead.
          connected=false
          for i in $(seq 1 30); do
            status=$(warp-cli --accept-tos status)
            echo "[${i}s] ${status}"
            if echo "$status" | grep -qi "Status update: Connected"; then
              connected=true
              break
            fi
            sleep 1
          done

          if [ "$connected" != "true" ]; then
            echo "::warning::WARP never reached Connected state - dumping warp-svc daemon logs"
            sudo journalctl -u warp-svc --no-pager -n 200 || true
            echo "Resetting WARP (mode off) so DNS/networking fall back to normal for the rest of the job"
            warp-cli --accept-tos disconnect || true
            warp-cli --accept-tos mode off || true
          else
            echo "--- Cloudflare trace (expect warp=on) ---"
            curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace || echo "trace curl failed"
            echo "--- Egress IP ---"
            curl -s --max-time 10 https://ifconfig.me || echo "ifconfig.me curl failed"; echo
          fi

          echo "--- Source reachability check (through WARP) ---"
          for url in \
            "https://m.etnews.com/news/section.html?id1=04" \
            "https://zdnet.co.kr/news/?lstcode=0020&page=1" \
            "https://www.dt.co.kr/ict/it" \
            "https://www.ddaily.co.kr/ai" \
            "https://www.dailysecu.com/news/articleList.html?sc_section_code=S1N9&view_type=sm" \
            "https://www.boannews.com/rss/S1N6.xml"; do
            curl -sS -o /dev/null -w "HTTP %{http_code} connect:%{time_connect}s total:%{time_total}s  ${url}\n" --max-time 15 "$url" || echo "UNREACHABLE  ${url}"
          done

      - name: Crawl ETNews (and retry any failed source) through WARP
        # Runs every configured source. Sources already crawled in the direct step
        # find nothing new (processed IDs are in the state file), so this effectively
        # crawls ETNews plus anything that failed over the runner's own network.
        # Exits non-zero only if every source failed.
        id: warp
        run: python scripts/run_daily.py

      - name: Disconnect Cloudflare WARP
        if: always()
        run: warp-cli --accept-tos disconnect || true

      - name: Commit and push if changes
        # Runs even if the WARP crawl step failed, so posts from the direct step are kept.
        if: ${{ !cancelled() }}
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # -A also stages deletions from the post.retention_days pruning step.
          git add -A _posts/ data/processed_articles.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-generated daily digest"
            # main may have moved while the crawl ran - replay our commit on top of it.
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        # GITHUB_TOKEN-authenticated pushes never trigger other workflows
        # (GitHub's anti-recursion rule), so pages-deploy.yml won't fire on
        # its own push trigger for the commit above. workflow_dispatch calls
        # are exempt from that rule, so dispatch it explicitly instead.
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
